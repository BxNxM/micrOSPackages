<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="black" media="(prefers-color-scheme: dark)" />
  <title>micrOS Matrix Drawer</title>
  <link rel="stylesheet" href="ustyle.css" />
  <script src="uapi.js" defer></script>
  <script src="matrix_draw.js" defer></script>
  <style>
    body {
      margin: 0;
    }
    .layout {
      display: flex; justify-content: center; align-items: flex-start;
      gap: 20px; margin: 20px auto; flex-wrap: wrap;
    }
    .matrix { display: grid; gap: 2px; touch-action: none; }
    .pixel {
      width: 30px; height: 30px; background: #000; border: 1px solid #333;
      box-sizing: border-box;
      cursor: pointer; user-select: none; touch-action: none;
    }
    input[type="number"], input[type="color"] { margin: 10px; padding: 4px; }
    .matrix-toolbar {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 8px;
      flex-wrap: wrap;
      width: max-content;
      max-width: 100%;
      margin: 10px auto;
      padding: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
      box-sizing: border-box;
    }
    .matrix-toolbar input,
    .matrix-toolbar button {
      height: 44px;
      margin: 0;
      box-sizing: border-box;
    }
    .matrix-toolbar button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    #colorPicker {
      width: 64px;
      min-height: 44px;
    }
    #matrixSize {
      width: 76px;
      max-width: 76px;
      text-align: center;
    }
    button { margin: 6px; padding: 6px 12px; }
    pre {
      text-align: left; max-width: 800px; margin: auto; background: #111;
      color: #0f0; padding: 10px; overflow-x: auto;
    }
    textarea {
      width: 100%; max-width: 400px; display: block; margin: 10px auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      background:#111; color:#0f0; border:1px solid #333; padding:8px;
      resize:vertical; white-space:pre; overflow:auto;
    }
    .side-panel { flex: 0 0 420px; }
    h1, .controls, h3 { text-align: center; }
  </style>
</head>
<body>
  <h1>microWeb Matrix LED Drawer</h1>
  <p id="restInfoHeader" class="controls"></p>

  <!-- Controls -->
  <div class="controls matrix-toolbar">
    <input type="color" id="colorPicker" value="#00ff00" title="Pick LED color" class="custom-color-picker" />
    <input type="number" id="matrixSize" value="8" min="1" max="64" title="Matrix size (NxN)" />
    <button id="resizeBtn">Resize</button>
    <button id="clearBtn">🧹 Clear Screen</button>
    <button id="stopAnimationBtn">⏹️ Stop Animation</button>
    <button id="startAnimationBtn">▶️ Start Animation</button>
  </div>

  <!-- Matrix left, tools right -->
  <div class="layout">
    <!-- Matrix grid -->
    <div id="matrix" class="matrix"></div>

    <!-- Side panel -->
    <div class="side-panel">
      <!-- Read device state -->
      <button id="readStateBtn">📥 Read Matrix</button>
      <button id="addFrameBtn">➕ Add Frame</button>
      <textarea id="matrixStateOut" rows="4"
        placeholder="Matrix state (original format) will appear here on ONE line…"></textarea>

      <!-- Matrix Frames -->
      <h3>🎞️ Matrix Frames</h3>
      <textarea id="matrixInput" rows="6"
        placeholder="One frame per line: [(0,0,(131,17,0)), (1,0,(...)), ...]"></textarea>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button id="sendMatrixBtn">🚀 Send REST Batches</button>
        <button id="applyMatrixBtn">🖌️ Apply Locally</button>
        <button id="exportJsonBtn">📋 Export JSONL Frames</button>
      </div>
      <textarea id="matrixJsonOut" rows="6" readonly
        placeholder="Exported JSONL frames will appear here, one frame per line..."></textarea>
      <p id="matrixInputStatus" style="margin:6px auto;color:#9cf;text-align:center"></p>
    </div>
  </div>

  <!-- REST Debug Console -->
  <hr>
  <h3>🛠 REST Debug Console</h3>
  <p id="restConsoleUrl"></p>
  <pre id="restConsoleResponse"></pre>
  <p id="restConsoleTime"></p>

</body>
</html>
